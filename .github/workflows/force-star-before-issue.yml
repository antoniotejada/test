name: Close Issue if Creator Didn't Star Repo

on:
  issues:
    types: [opened, reopened]

jobs:
  check-star:
    runs-on: ubuntu-latest
    steps:
      - name: Check if user has starred the repo
        id: check_star
        uses: actions/github-script@v6
        with:
          script: |
            
            const issueUser = context.payload.issue.user.login;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            /*
            const stargazers = await github.paginate(
              github.rest.repos.listStargazers, 
              {
                owner: repoOwner,
                repo: repoName,
                per_page: 100
              }
            );
            console.log("Stargazers", stargazers);
            console.log("User", issueUser);
            const hasStarred = stargazers.some(star => star.login === issueUser);
            */
            
            // /user/starred/{owner}/{repo}
            console.log(github.rest);
            const response = await github.rest.user.starred({owner: repoOwner, repo: repoName});
            console.log("Reponse", response);
            return response;

      - name: Add comment if user has not starred the repo
        if: steps.check_star.outputs.result == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issueUser = context.payload.issue.user.login;
            const comment = `Hello @${issueUser}, in order to create issues in this repository, you need to star it first. Please star the repo and reopen the issue.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: Close issue if user has not starred the repo
        if: steps.check_star.outputs.result == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
